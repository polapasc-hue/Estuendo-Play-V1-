name: Generar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Compilar APK con Bubblewrap (PWA)
      run: |
        npm install -g @bubblewrap/cli
        # Aquí puedes agregar los comandos de empaquetado si tu app usa una web manifest configurada,
        # o puedes integrar una acción de PWABuilder.
