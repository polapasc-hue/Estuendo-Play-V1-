name: Generar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar dependencias y compilar
      run: |
        npm install
        # npm run build  # Descomenta esta línea si tu proyecto requiere un comando de compilación web

    - name: Listar archivos generados
      run: ls -la
