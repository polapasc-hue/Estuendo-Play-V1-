name: Generar APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Construir aplicación web
      run: |
        npm install
        # Si tienes un comando de compilación (como npm run build), ponlo aquí:
        # npm run build

    - name: Generar APK con PWABuilder CLI
      run: |
        npm install -g @pwabuilder/pwabuilder-cli
        # O puedes empaquetar según los requerimientos de tu proyecto
